<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 720 240" role="img" aria-label="로드 배리어 흐름. 참조를 읽으면 색을 확인하고, 좋은 상태면 그대로 쓰고, 나쁜 상태면 느린 경로에서 새 주소를 찾거나 직접 옮긴 뒤 필드를 새 주소로 고쳐 쓴다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-plain" x="20" y="92" width="150" height="56" rx="8"></rect><text class="t c" x="95" y="116">참조 읽기</text><text class="s c m" x="95" y="135">x = obj.field</text><line class="ln-a" x1="170" y1="120" x2="208" y2="120"></line><rect class="bx-conc" x="210" y="92" width="140" height="56" rx="28"></rect><text class="t c" x="280" y="116">로드 배리어</text><text class="s c" x="280" y="135">참조의 색 확인</text><path class="ln-a" d="M350,108 L380,50 L408,50"></path><text class="s" x="362" y="80">좋은 상태</text><rect class="bx-heap" x="410" y="22" width="290" height="56" rx="8"></rect><text class="t c" x="555" y="46">빠른 경로: 그대로 사용</text><text class="s c" x="555" y="65">대부분의 경우. 명령어 몇 개</text><path class="ln-a" d="M350,132 L380,190 L408,190"></path><text class="s" x="362" y="166">나쁜 상태</text><rect class="bx-stw" x="410" y="162" width="290" height="56" rx="8"></rect><text class="t c" x="555" y="186">느린 경로: 새 주소 찾기 / 직접 옮기기</text><text class="s c" x="555" y="205">그리고 필드를 새 주소로 고쳐 씀 (self-healing)</text></svg>