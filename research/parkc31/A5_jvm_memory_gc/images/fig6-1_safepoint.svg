<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 720 250" role="img" aria-label="safepoint 타임라인. 요청 후 스레드들이 서로 다른 시점에 safepoint에 도착하고, 마지막 스레드가 도착해야 GC 작업이 시작된다. GC 로그에는 작업 시간만 찍히고 도달 시간(TTSP)은 빠진다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><text class="t" x="20" y="60">스레드 1</text><text class="t" x="20" y="105">스레드 2</text><text class="t" x="20" y="150">스레드 3</text><rect class="bx-heap" x="90" y="45" width="130" height="24" rx="3"></rect><rect class="bx-free" x="220" y="45" width="110" height="24"></rect><rect class="bx-heap" x="90" y="90" width="155" height="24" rx="3"></rect><rect class="bx-free" x="245" y="90" width="85" height="24"></rect><rect class="bx-heap" x="90" y="135" width="240" height="24" rx="3"></rect><text class="s" x="250" y="152">긴 반복문</text><rect class="bx-stw" x="330" y="38" width="120" height="128" rx="4"></rect><text class="t c sd b" x="390" y="95">GC 작업</text><text class="s c" x="390" y="113">로그에 찍히는</text><text class="s c" x="390" y="129">pause</text><rect class="bx-heap" x="450" y="45" width="250" height="24" rx="3"></rect><rect class="bx-heap" x="450" y="90" width="250" height="24" rx="3"></rect><rect class="bx-heap" x="450" y="135" width="250" height="24" rx="3"></rect><line class="ln-stw" x1="210" y1="26" x2="210" y2="172"></line><text class="s sd" x="150" y="22">safepoint 요청</text><line class="ln" x1="210" y1="190" x2="330" y2="190"></line><line class="ln" x1="210" y1="184" x2="210" y2="196"></line><line class="ln" x1="330" y1="184" x2="330" y2="196"></line><text class="s c" x="270" y="206">TTSP (로그에 없음)</text><line class="ln" x1="210" y1="224" x2="450" y2="224"></line><line class="ln" x1="210" y1="218" x2="210" y2="230"></line><line class="ln" x1="450" y1="218" x2="450" y2="230"></line><text class="t c" x="330" y="244">애플리케이션이 실제로 느끼는 멈춤</text></svg>