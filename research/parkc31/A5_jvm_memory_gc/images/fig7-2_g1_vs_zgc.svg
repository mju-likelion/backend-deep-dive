<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="380" viewBox="0 0 720 190" role="img" aria-label="G1과 ZGC의 멈춤 비교 타임라인. G1은 수 밀리초에서 수십 밀리초의 멈춤이 가끔 있고, ZGC는 아주 짧은 멈춤이 자주 있으며 GC 작업 대부분이 애플리케이션과 동시에 진행된다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><text class="t b" x="20" y="62">G1</text><rect class="bx-heap" x="80" y="45" width="620" height="28" rx="3"></rect><rect class="bx-stw" x="160" y="41" width="18" height="36"></rect><rect class="bx-stw" x="330" y="41" width="30" height="36"></rect><rect class="bx-stw" x="520" y="41" width="22" height="36"></rect><text class="t b" x="20" y="132">ZGC</text><rect class="bx-heap" x="80" y="115" width="620" height="28" rx="3"></rect><rect class="bx-stw" x="170" y="111" width="3" height="36"></rect><rect class="bx-stw" x="260" y="111" width="3" height="36"></rect><rect class="bx-stw" x="300" y="111" width="3" height="36"></rect><rect class="bx-stw" x="430" y="111" width="3" height="36"></rect><rect class="bx-stw" x="520" y="111" width="3" height="36"></rect><rect class="bx-stw" x="560" y="111" width="3" height="36"></rect><rect class="bx-conc" x="170" y="150" width="133" height="7" rx="2"></rect><rect class="bx-conc" x="430" y="150" width="133" height="7" rx="2"></rect><text class="s" x="80" y="178">초록: 애플리케이션 실행 / 빨강: STW / 보라: 애플리케이션과 동시에 도는 GC 작업</text></svg>