<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 720 210" role="img" aria-label="힙 안의 작은 ByteBuffer 객체가 힙 밖의 큰 네이티브 버퍼를 가리킨다. ByteBuffer 객체가 GC로 회수될 때 Cleaner가 네이티브 메모리를 해제한다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-heap" x="20" y="30" width="290" height="130" rx="10"></rect><text class="t b hd" x="36" y="54">힙</text><rect class="bx-plain" x="50" y="80" width="200" height="50" rx="6"></rect><text class="t c" x="150" y="102">ByteBuffer 객체</text><text class="s c" x="150" y="120">수십 바이트</text><rect class="bx-native" x="390" y="30" width="310" height="130" rx="10"></rect><text class="t b nd" x="406" y="54">힙 밖 (네이티브)</text><rect class="bx-plain" x="420" y="70" width="250" height="70" rx="6"></rect><text class="t c" x="545" y="100">실제 버퍼 메모리</text><text class="s c" x="545" y="120">수 KB ~ 수 MB</text><line class="ln-a" x1="250" y1="105" x2="418" y2="105"></line><text class="s c" x="360" y="190">ByteBuffer 객체가 GC로 회수될 때 Cleaner가 네이티브 메모리를 해제한다</text></svg>