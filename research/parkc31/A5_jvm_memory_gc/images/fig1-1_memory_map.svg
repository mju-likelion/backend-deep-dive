<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 720 320" role="img" aria-label="JVM 프로세스 메모리 지도. 왼쪽 힙에는 Young(Eden, S0, S1)과 Old, 오른쪽 힙 밖에는 Metaspace, 스레드 스택, 코드 캐시, GC 자료구조, 다이렉트 버퍼, 기타가 있다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-plain" x="10" y="10" width="700" height="300" rx="14"></rect><text class="t b" x="30" y="36">JVM 프로세스 (OS와 컨테이너가 보는 RSS)</text><rect class="bx-heap" x="30" y="55" width="320" height="235" rx="10"></rect><text class="t b hd" x="50" y="80">힙 (-Xmx로 제한)</text><rect class="bx-plain" x="50" y="95" width="280" height="85" rx="6"></rect><text class="t" x="62" y="115">Young</text><rect class="bx-heap" x="60" y="124" width="150" height="46" rx="4"></rect><text class="t c" x="135" y="152">Eden</text><rect class="bx-heap" x="216" y="124" width="52" height="46" rx="4"></rect><text class="t c" x="242" y="152">S0</text><rect class="bx-heap" x="274" y="124" width="46" height="46" rx="4"></rect><text class="t c" x="297" y="152">S1</text><rect class="bx-plain" x="50" y="192" width="280" height="84" rx="6"></rect><text class="t" x="62" y="215">Old</text><text class="s" x="62" y="236">오래 살아남은 객체</text><text class="s" x="62" y="256">static 필드 값, intern 문자열도 힙에 있다</text><rect class="bx-native" x="370" y="55" width="320" height="235" rx="10"></rect><text class="t b nd" x="390" y="80">힙 밖 (네이티브 메모리)</text><rect class="bx-plain" x="385" y="95" width="140" height="56" rx="6"></rect><text class="t c" x="455" y="118">Metaspace</text><text class="s c" x="455" y="138">클래스 메타데이터</text><rect class="bx-plain" x="535" y="95" width="140" height="56" rx="6"></rect><text class="t c" x="605" y="118">스레드 스택</text><text class="s c" x="605" y="138">스레드당 -Xss</text><rect class="bx-plain" x="385" y="160" width="140" height="56" rx="6"></rect><text class="t c" x="455" y="183">코드 캐시</text><text class="s c" x="455" y="203">JIT 기계어</text><rect class="bx-plain" x="535" y="160" width="140" height="56" rx="6"></rect><text class="t c" x="605" y="183">GC 자료구조</text><text class="s c" x="605" y="203">RSet, 비트맵</text><rect class="bx-plain" x="385" y="225" width="140" height="56" rx="6"></rect><text class="t c" x="455" y="248">다이렉트 버퍼</text><text class="s c" x="455" y="268">NIO, Netty</text><rect class="bx-plain" x="535" y="225" width="140" height="56" rx="6"></rect><text class="t c" x="605" y="248">기타</text><text class="s c" x="605" y="268">심볼, malloc</text></svg>