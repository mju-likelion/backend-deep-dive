<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 720 170" role="img" aria-label="Path to GC Roots 예시. static 필드 CACHE가 ArrayList를, ArrayList가 내부 배열을, 내부 배열이 수만 개의 byte 배열을 붙잡고 있다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-conc" x="20" y="45" width="165" height="62" rx="8"></rect><text class="t c" x="102" y="70">GC Root</text><text class="s c m" x="102" y="90">static CACHE</text><line class="ln-a" x1="185" y1="76" x2="213" y2="76"></line><rect class="bx-plain" x="215" y="45" width="130" height="62" rx="8"></rect><text class="t c" x="280" y="70">ArrayList</text><text class="s c" x="280" y="90">shallow 24B</text><line class="ln-a" x1="345" y1="76" x2="373" y2="76"></line><rect class="bx-plain" x="375" y="45" width="145" height="62" rx="8"></rect><text class="t c" x="447" y="70">Object[]</text><text class="s c" x="447" y="90">내부 배열</text><line class="ln-a" x1="520" y1="76" x2="548" y2="76"></line><rect class="bx-stw" x="550" y="45" width="150" height="62" rx="8"></rect><text class="t c" x="625" y="70">byte[] × 50,000</text><text class="s c" x="625" y="90">실제로 큰 것</text><text class="t c hd" x="280" y="135">retained 약 240MB</text><text class="s c" x="280" y="154">이 리스트를 없애면 오른쪽 전부가 회수된다</text></svg>