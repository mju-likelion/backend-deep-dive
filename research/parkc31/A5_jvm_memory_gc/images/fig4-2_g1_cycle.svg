<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 720 330" role="img" aria-label="G1 사이클. Young GC를 반복하다 Old 점유율이 IHOP를 넘으면 Concurrent Start, 동시 마킹, Remark, Cleanup을 거쳐 Mixed GC를 여러 번 하고 다시 Young-only로 돌아간다. 공간이 부족하면 최후 수단으로 Full GC가 일어난다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-stw" x="20" y="40" width="150" height="70" rx="8"></rect><text class="t c b" x="95" y="68">① Young GC 반복</text><text class="s c" x="95" y="90">STW, 병렬 복사</text><line class="ln-a" x1="170" y1="75" x2="198" y2="75"></line><text class="s c" x="184" y="30">IHOP 초과</text><rect class="bx-stw" x="200" y="40" width="150" height="70" rx="8"></rect><text class="t c b" x="275" y="68">② Concurrent Start</text><text class="s c" x="275" y="90">Young GC와 함께 시작</text><line class="ln-a" x1="350" y1="75" x2="378" y2="75"></line><rect class="bx-conc" x="380" y="40" width="150" height="70" rx="8"></rect><text class="t c b" x="455" y="68">③ 동시 마킹</text><text class="s c" x="455" y="90">앱과 동시에 (SATB)</text><line class="ln-a" x1="530" y1="75" x2="558" y2="75"></line><rect class="bx-stw" x="560" y="40" width="140" height="70" rx="8"></rect><text class="t c b" x="630" y="68">④ Remark</text><text class="s c" x="630" y="90">STW, 마킹 마무리</text><line class="ln-a" x1="630" y1="110" x2="630" y2="158"></line><rect class="bx-stw" x="560" y="160" width="140" height="70" rx="8"></rect><text class="t c b" x="630" y="188">⑤ Cleanup</text><text class="s c" x="630" y="210">STW, 후보 선정</text><line class="ln-a" x1="560" y1="195" x2="532" y2="195"></line><rect class="bx-stw" x="330" y="160" width="200" height="70" rx="8"></rect><text class="t c b" x="430" y="188">⑥ Mixed GC 여러 번</text><text class="s c" x="430" y="210">Young + 쓰레기 많은 Old 리전</text><path class="ln-a" d="M330,195 L95,195 L95,112"></path><text class="s" x="120" y="185">충분히 회수하면 ①로</text><rect class="bx-stw" x="20" y="262" width="300" height="52" rx="8" style="stroke-dasharray:6 4"></rect><text class="t c b sd" x="170" y="285">⑦ 최후 수단: Full GC</text><text class="s c" x="170" y="303">복사할 공간 부족 시, 힙 전체 STW 압축</text><rect class="bx-stw" x="360" y="272" width="16" height="16" rx="3"></rect><text class="s" x="382" y="285">STW 구간</text><rect class="bx-conc" x="460" y="272" width="16" height="16" rx="3"></rect><text class="s" x="482" y="285">애플리케이션과 동시에</text></svg>