<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="330" viewBox="0 0 720 165" role="img" aria-label="JVM 프로세스 메모리 구성 막대. 힙 512MB에 Metaspace, 스레드 스택, 코드 캐시, GC 자료구조, 다이렉트 버퍼, 기타가 더해져 컨테이너 한도 1GB를 넘는다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><rect class="bx-heap" x="20" y="40" width="280" height="56" rx="4"></rect><text class="t c b" x="160" y="73">힙 (-Xmx 512MB)</text><rect class="bx-native" x="300" y="40" width="60" height="56"></rect><rect class="bx-native" x="360" y="40" width="82" height="56"></rect><rect class="bx-native" x="442" y="40" width="27" height="56"></rect><rect class="bx-native" x="469" y="40" width="33" height="56"></rect><rect class="bx-native" x="502" y="40" width="44" height="56"></rect><rect class="bx-native" x="546" y="40" width="50" height="56"></rect><line class="ln" x1="330" y1="96" x2="330" y2="112"></line><text class="s c" x="330" y="124">Metaspace</text><line class="ln" x1="401" y1="96" x2="401" y2="132"></line><text class="s c" x="401" y="146">스레드 스택</text><line class="ln" x1="455" y1="96" x2="455" y2="112"></line><text class="s c" x="455" y="124">코드 캐시</text><line class="ln" x1="485" y1="96" x2="485" y2="132"></line><text class="s c" x="485" y="146">GC 자료구조</text><line class="ln" x1="524" y1="96" x2="524" y2="112"></line><text class="s c" x="530" y="124">다이렉트 버퍼</text><line class="ln" x1="571" y1="96" x2="571" y2="132"></line><text class="s c" x="571" y="146">기타</text><line class="ln-stw" x1="580" y1="18" x2="580" y2="104"></line><text class="t sd" x="588" y="30">컨테이너 한도 1GB</text></svg>