"128">75%</text><text class="s sd" x="20" y="146">한도 초과</text><rect class="bx-heap" x="120" y="112" width="360" height="36"></rect><rect class="bx-native" x="480" y="112" width="120" height="36"></rect><rect class="bx-stw" x="600" y="112" width="11" height="36"></rect><text class="t" x="20" y="198">90%</text><text class="s sd" x="20" y="216">크게 초과</text><rect class="bx-heap" x="120" y="182" width="432" height="36"></rect><rect class="bx-native" x="552" y="182" width="48" height="36"></rect><rect class="bx-stw" x="600" y="182" width="83" height="36"></rect><line class="ln-stw" x1="600" y1="20" x2="600" y2="232"></line><text class="t sd" x="560" y="16">한도 1GB</text><text class="s" x="120" y="244">초록: 최대 힙 / 주황: 힙 밖 메모리(예시 약 280MB) / 빨강: 한도를 넘은 부분</text></svg>