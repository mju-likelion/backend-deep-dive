<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 720 200" role="img" aria-label="Eden을 스레드별 TLAB 세 개와 공유 영역으로 나눈 그림. 각 TLAB 안에서 top 포인터를 밀어 할당하고, end에 닿으면 새 TLAB을 받는다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{fill:#1C2733;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:13px;font-weight:500}.s{fill:#5A6878;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:11.5px}.m{font-family:Menlo,Consolas,monospace;font-size:11.5px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.hd{fill:#1E7F74}.nd{fill:#A96B12}.sd{fill:#B23A48}.cd{fill:#4F4AA0}.bx-heap{fill:#DCEFEB;stroke:#1E7F74;stroke-width:1.2}.bx-native{fill:#FBEEDB;stroke:#A96B12;stroke-width:1.2}.bx-stw{fill:#F8E2E5;stroke:#B23A48;stroke-width:1.2}.bx-conc{fill:#E7E5F7;stroke:#4F4AA0;stroke-width:1.2}.bx-plain{fill:#FFFFFF;stroke:#D3DAE2;stroke-width:1.2}.bx-old{fill:#D3DAE2;stroke:#5A6878;stroke-width:1}.bx-dead{fill:#D3DAE2;stroke:none}.bx-free{fill:none;stroke:#5A6878;stroke-width:1;stroke-dasharray:3 3}.fill-heap{fill:#1E7F74;opacity:.35}.ln{stroke:#5A6878;stroke-width:1.5;fill:none}.ln-a{stroke:#5A6878;stroke-width:1.5;fill:none;marker-end:url(#arw)}.ln-stw{stroke:#B23A48;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.ln-conc{stroke:#4F4AA0;stroke-width:1.5;fill:none;marker-end:url(#arw)}.arw-head{fill:#5A6878}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arw-head"/></marker></defs><text class="t c" x="105" y="52">스레드 1</text><text class="t c" x="280" y="52">스레드 2</text><text class="t c" x="455" y="52">스레드 3</text><rect class="bx-heap" x="20" y="65" width="680" height="60" rx="6"></rect><rect class="bx-plain" x="22" y="67" width="168" height="56"></rect><rect class="fill-heap" x="22" y="67" width="108" height="56"></rect><rect class="bx-plain" x="195" y="67" width="170" height="56"></rect><rect class="fill-heap" x="195" y="67" width="60" height="56"></rect><rect class="bx-plain" x="370" y="67" width="170" height="56"></rect><rect class="fill-heap" x="370" y="67" width="140" height="56"></rect><rect class="bx-free" x="545" y="67" width="153" height="56"></rect><text class="s c" x="621" y="92">TLAB 밖 공유 영역</text><text class="s c" x="621" y="110">큰 객체는 여기로</text><text class="s c" x="76" y="100">할당된 객체</text><line class="ln" x1="130" y1="62" x2="130" y2="135"></line><text class="s c m" x="130" y="150">top</text><line class="ln" x1="190" y1="62" x2="190" y2="135"></line><text class="s c m" x="190" y="150">end</text><text class="s" x="20" y="180">Eden (모든 스레드가 공유). 스레드는 자기 TLAB 안에서만 top을 밀며 할당한다.</text></svg>