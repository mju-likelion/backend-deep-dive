<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1565c0"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e65100"/></marker>
  </defs>
  <rect width="1040" height="430" fill="#ffffff"/>
  <text x="40" y="30" font-size="17" font-weight="700" fill="#212121">리사이징: 16칸에서 32칸으로. 각 원소는 '제자리' 아니면 '제자리 + 16'으로만 간다</text>

  <text x="40" y="62" font-size="13" fill="#616161">16칸 (하위 4비트로 칸 결정)</text>
  <g fill="#fafafa" stroke="#9e9e9e">
    <rect x="60" y="70" width="56" height="34"/><rect x="172" y="70" width="56" height="34"/><rect x="228" y="70" width="56" height="34"/>
    <rect x="284" y="70" width="56" height="34"/><rect x="340" y="70" width="56" height="34"/><rect x="396" y="70" width="56" height="34"/>
    <rect x="508" y="70" width="56" height="34"/><rect x="564" y="70" width="56" height="34"/><rect x="620" y="70" width="56" height="34"/>
    <rect x="676" y="70" width="56" height="34"/><rect x="732" y="70" width="56" height="34"/><rect x="788" y="70" width="56" height="34"/>
    <rect x="844" y="70" width="56" height="34"/><rect x="900" y="70" width="56" height="34"/>
  </g>
  <rect x="116" y="70" width="56" height="34" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <rect x="452" y="70" width="56" height="34" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <g font-size="12" fill="#616161" text-anchor="middle"><text x="88" y="92">0</text><text x="144" y="92">1</text><text x="480" y="92">7</text><text x="928" y="92">15</text></g>

  <g font-size="13" text-anchor="middle">
    <rect x="109" y="118" width="70" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="144" y="136">ab</text>
    <rect x="109" y="152" width="70" height="26" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="144" y="170">apple</text>
    <rect x="445" y="118" width="70" height="26" rx="4" fill="#fff3e0" stroke="#e65100"/><text x="480" y="136">cat</text>
  </g>
  <line x1="144" y1="104" x2="144" y2="118" stroke="#1565c0"/><line x1="144" y1="144" x2="144" y2="152" stroke="#1565c0"/>
  <line x1="480" y1="104" x2="480" y2="118" stroke="#e65100"/>

  <g font-family="Menlo, monospace" font-size="13">
    <text x="192" y="136">ab    …<tspan fill="#2e7d32" font-weight="700">0</tspan> 0001</text>
    <text x="192" y="170">apple …<tspan fill="#e65100" font-weight="700">1</tspan> 0001</text>
    <text x="528" y="136">cat …<tspan fill="#e65100" font-weight="700">1</tspan> 0111</text>
  </g>
  <text x="700" y="170" font-size="12" fill="#616161">굵은 비트 = 16의 자리 비트</text>

  <g stroke-width="1.8" fill="none">
    <path d="M109 131 H95 V292" stroke="#1565c0" marker-end="url(#ab)"/>
    <line x1="160" y1="178" x2="550" y2="292" stroke="#1565c0" marker-end="url(#ab)"/>
    <line x1="480" y1="144" x2="718" y2="292" stroke="#e65100" marker-end="url(#ao)"/>
  </g>
  <g font-size="12">
    <text x="104" y="250" fill="#2e7d32">비트 0, 그대로 1번</text>
    <text x="360" y="215" fill="#e65100">비트 1, 1 + 16 = 17번</text>
    <text x="650" y="215" fill="#e65100">비트 1, 7 + 16 = 23번</text>
  </g>

  <text x="760" y="286" font-size="13" fill="#616161">32칸 (하위 5비트로 칸 결정)</text>
  <g fill="#fafafa" stroke="#bdbdbd">
    <rect x="60" y="296" width="896" height="34"/>
  </g>
  <g stroke="#e0e0e0">
    <line x1="88" y1="296" x2="88" y2="330"/><line x1="116" y1="296" x2="116" y2="330"/><line x1="144" y1="296" x2="144" y2="330"/>
    <line x1="508" y1="296" x2="508" y2="330"/><line x1="536" y1="296" x2="536" y2="330"/><line x1="564" y1="296" x2="564" y2="330"/>
    <line x1="676" y1="296" x2="676" y2="330"/><line x1="704" y1="296" x2="704" y2="330"/><line x1="732" y1="296" x2="732" y2="330"/>
  </g>
  <rect x="88" y="296" width="28" height="34" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <rect x="536" y="296" width="28" height="34" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <rect x="704" y="296" width="28" height="34" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <g font-size="11" fill="#616161" text-anchor="middle"><text x="102" y="346">1</text><text x="550" y="346">17</text><text x="718" y="346">23</text><text x="74" y="346">0</text><text x="942" y="346">31</text></g>

  <text x="40" y="384" font-size="14" fill="#212121">칸 수가 2배가 되면 칸 번호를 정하는 비트가 하나 늘어난다. 늘어난 비트가 0이면 그대로, 1이면 +16.</text>
  <text x="40" y="410" font-size="14" fill="#212121">그래서 해시를 처음부터 다시 계산하지 않고, 칸마다 줄을 '그대로 팀'과 '+16 팀' 둘로 나누기만 하면 된다.</text>
</svg>
