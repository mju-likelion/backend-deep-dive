<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" width="1040" height="530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1040" height="530" fill="#ffffff"/>

  <!-- ArrayList -->
  <text x="40" y="30" font-size="17" font-weight="700" fill="#2e7d32">ArrayList.add(8, X) — 참조가 배열 하나에 연속으로 놓여 있다</text>
  <rect x="444" y="44" width="48" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="468" y="64" font-size="14" text-anchor="middle" font-weight="700">X</text>
  <line x1="468" y1="74" x2="468" y2="108" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="505" y1="92" x2="840" y2="92" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="515" y="84" font-size="13" fill="#2e7d32">뒤쪽을 한 칸씩 밀기 = System.arraycopy 한 번 (연속 복사)</text>

  <g font-size="13" text-anchor="middle">
    <g fill="#e8f5e9" stroke="#2e7d32">
      <rect x="60" y="110" width="48" height="40"/><rect x="108" y="110" width="48" height="40"/>
      <rect x="156" y="110" width="48" height="40"/><rect x="204" y="110" width="48" height="40"/>
      <rect x="252" y="110" width="48" height="40"/><rect x="300" y="110" width="48" height="40"/>
      <rect x="348" y="110" width="48" height="40"/><rect x="396" y="110" width="48" height="40"/>
    </g>
    <g fill="#fff3e0" stroke="#2e7d32">
      <rect x="444" y="110" width="48" height="40"/><rect x="492" y="110" width="48" height="40"/>
      <rect x="540" y="110" width="48" height="40"/><rect x="588" y="110" width="48" height="40"/>
      <rect x="636" y="110" width="48" height="40"/><rect x="684" y="110" width="48" height="40"/>
      <rect x="732" y="110" width="48" height="40"/><rect x="780" y="110" width="48" height="40"/>
    </g>
    <text x="84" y="135">a</text><text x="132" y="135">b</text><text x="180" y="135">c</text><text x="228" y="135">d</text>
    <text x="276" y="135">e</text><text x="324" y="135">f</text><text x="372" y="135">g</text><text x="420" y="135">h</text>
    <text x="468" y="135">i</text><text x="516" y="135">j</text><text x="564" y="135">k</text><text x="612" y="135">l</text>
    <text x="660" y="135">m</text><text x="708" y="135">n</text><text x="756" y="135">o</text><text x="804" y="135">p</text>
  </g>
  <path d="M60 160 v8 h768 v-8" fill="none" stroke="#616161" stroke-width="1.5"/>
  <text x="444" y="188" font-size="13" fill="#424242" text-anchor="middle">캐시 라인 1개(64B)에 참조(4B) 16개가 들어간다. 메모리 왕복 1번에 전부 도착하고, 다음 라인은 프리페처가 미리 가져온다</text>

  <!-- LinkedList -->
  <text x="40" y="232" font-size="17" font-weight="700" fill="#e65100">LinkedList.add(8, X) — 노드가 힙 곳곳에 흩어져 있다</text>
  <rect x="40" y="245" width="960" height="225" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  <text x="985" y="462" font-size="12" fill="#9e9e9e" text-anchor="end">힙</text>

  <g stroke="#ef6c00" stroke-width="1.8" fill="none">
    <line x1="92" y1="286" x2="452" y2="416"/>
    <line x1="452" y1="416" x2="792" y2="286"/>
    <line x1="792" y1="286" x2="232" y2="426"/>
    <line x1="232" y1="426" x2="592" y2="316"/>
    <line x1="592" y1="316" x2="932" y2="426"/>
    <line x1="932" y1="426" x2="162" y2="346"/>
    <line x1="162" y1="346" x2="712" y2="436"/>
    <line x1="712" y1="436" x2="912" y2="281"/>
  </g>

  <g font-size="14" text-anchor="middle">
    <g fill="#fff3e0" stroke="#e65100">
      <rect x="60" y="270" width="64" height="32" rx="4"/>
      <rect x="420" y="400" width="64" height="32" rx="4"/>
      <rect x="760" y="270" width="64" height="32" rx="4"/>
      <rect x="200" y="410" width="64" height="32" rx="4"/>
      <rect x="560" y="300" width="64" height="32" rx="4"/>
      <rect x="900" y="410" width="64" height="32" rx="4"/>
      <rect x="130" y="330" width="64" height="32" rx="4"/>
      <rect x="680" y="420" width="64" height="32" rx="4"/>
    </g>
    <rect x="880" y="265" width="64" height="32" rx="4" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
    <text x="92" y="291">a</text><text x="452" y="421">b</text><text x="792" y="291">c</text><text x="232" y="431">d</text>
    <text x="592" y="321">e</text><text x="932" y="431">f</text><text x="162" y="351">g</text><text x="712" y="441">h</text>
    <text x="912" y="286" font-weight="700">i</text>
  </g>
  <text x="912" y="318" font-size="12" fill="#e65100" text-anchor="middle">삽입 자체는 O(1)</text>

  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="272" cy="351" r="11" fill="#e65100"/><text x="272" y="355">1</text>
    <circle cx="622" cy="351" r="11" fill="#e65100"/><text x="622" y="355">2</text>
    <circle cx="512" cy="356" r="11" fill="#e65100"/><text x="512" y="360">3</text>
    <circle cx="412" cy="371" r="11" fill="#e65100"/><text x="412" y="375">4</text>
    <circle cx="762" cy="371" r="11" fill="#e65100"/><text x="762" y="375">5</text>
    <circle cx="547" cy="386" r="11" fill="#e65100"/><text x="547" y="390">6</text>
    <circle cx="437" cy="389" r="11" fill="#e65100"/><text x="437" y="393">7</text>
    <circle cx="812" cy="358" r="11" fill="#e65100"/><text x="812" y="362">8</text>
  </g>

  <text x="40" y="498" font-size="14" fill="#212121">삽입할 자리(i)에 닿기 전에 포인터를 8번 따라가야 한다. 다음 주소는 지금 노드를 읽어야 알 수 있어 한 걸음씩 기다린다.</text>
  <text x="40" y="520" font-size="14" fill="#212121">노드가 이렇게 흩어져 있으면 번호 하나하나가 <tspan font-weight="700" fill="#e65100">메인 메모리 왕복(~100 ns)</tspan>이다. ArrayList는 같은 O(n)을 연속 복사 한 번으로 끝낸다.</text>
</svg>
