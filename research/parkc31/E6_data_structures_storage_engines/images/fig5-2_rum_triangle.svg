<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="780" height="500" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#212121">RUM 추측: 읽기·쓰기·공간 비용을 동시에 최소화할 수는 없다</text>

  <polygon points="390,80 110,420 670,420" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="390" cy="80" r="7" fill="#1565c0"/>
  <circle cx="110" cy="420" r="7" fill="#2e7d32"/>
  <circle cx="670" cy="420" r="7" fill="#6a1b9a"/>
  <text x="390" y="64" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">읽기 비용 최소 (Read)</text>
  <text x="110" y="450" font-size="15" font-weight="700" fill="#2e7d32" text-anchor="middle">쓰기 비용 최소 (Update)</text>
  <text x="670" y="450" font-size="15" font-weight="700" fill="#6a1b9a" text-anchor="middle">공간 비용 최소 (Memory)</text>

  <g font-size="14">
    <circle cx="410" cy="165" r="9" fill="#1565c0"/>
    <text x="428" y="170" fill="#212121">B-tree</text>
    <circle cx="300" cy="300" r="9" fill="#43a047"/>
    <text x="318" y="305" fill="#212121">LSM (Leveled)</text>
    <circle cx="185" cy="385" r="9" fill="#2e7d32"/>
    <text x="203" y="390" fill="#212121">LSM (Size-tiered)</text>
    <circle cx="575" cy="375" r="9" fill="#6a1b9a"/>
    <text x="500" y="355" fill="#212121">블룸 필터 같은 근사 구조</text>
  </g>

  <text x="30" y="482" font-size="13" fill="#616161">꼭짓점에 가까울수록 그 비용이 작다. 한 꼭짓점에 다가가면 나머지 둘에서는 멀어진다. 위치는 개념적 배치다.</text>
</svg>
