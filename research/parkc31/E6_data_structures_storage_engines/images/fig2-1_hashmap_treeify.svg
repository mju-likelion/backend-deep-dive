<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#616161"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e65100"/></marker>
  </defs>
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="40" y="32" font-size="15" fill="#212121"><tspan font-family="Menlo, monospace" font-weight="700">index = (h ^ (h &gt;&gt;&gt; 16)) &amp; (n - 1)</tspan>   상위 비트를 섞은 뒤, 하위 비트로 칸을 고른다</text>

  <g font-size="13" text-anchor="middle" fill="#212121">
    <g fill="#e3f2fd" stroke="#1565c0">
      <rect x="60" y="56" width="56" height="34"/><rect x="130" y="56" width="56" height="34"/>
      <rect x="200" y="56" width="56" height="34"/><rect x="270" y="56" width="56" height="34"/>
      <rect x="340" y="56" width="56" height="34"/><rect x="410" y="56" width="56" height="34"/>
      <rect x="480" y="56" width="56" height="34"/><rect x="550" y="56" width="56" height="34"/>
    </g>
    <text x="88" y="78">[0]</text><text x="158" y="78">[1]</text><text x="228" y="78">[2]</text><text x="298" y="78">[3]</text>
    <text x="368" y="78">[4]</text><text x="438" y="78">[5]</text><text x="508" y="78">[6]</text><text x="578" y="78">[7]</text>
    <text x="640" y="78" text-anchor="start" fill="#757575">… [15]</text>
  </g>

  <g stroke="#616161" stroke-width="1.5">
    <line x1="158" y1="90" x2="158" y2="116" marker-end="url(#a)"/>
    <line x1="298" y1="90" x2="298" y2="116" marker-end="url(#a)"/>
    <line x1="298" y1="142" x2="298" y2="156" marker-end="url(#a)"/>
    <line x1="508" y1="90" x2="508" y2="116" marker-end="url(#a)"/>
  </g>
  <g fill="#e8f5e9" stroke="#2e7d32">
    <rect x="134" y="118" width="48" height="24" rx="3"/>
    <rect x="274" y="118" width="48" height="24" rx="3"/>
    <rect x="274" y="158" width="48" height="24" rx="3"/>
  </g>
  <g fill="#ffe0b2" stroke="#e65100">
    <rect x="484" y="118" width="48" height="22" rx="3"/><rect x="484" y="148" width="48" height="22" rx="3"/>
    <rect x="484" y="178" width="48" height="22" rx="3"/><rect x="484" y="208" width="48" height="22" rx="3"/>
    <rect x="484" y="238" width="48" height="22" rx="3"/><rect x="484" y="268" width="48" height="22" rx="3"/>
    <rect x="484" y="298" width="48" height="22" rx="3"/><rect x="484" y="328" width="48" height="22" rx="3"/>
    <rect x="484" y="358" width="48" height="22" rx="3"/>
  </g>
  <g stroke="#e65100" stroke-width="1.2">
    <line x1="508" y1="140" x2="508" y2="148"/><line x1="508" y1="170" x2="508" y2="178"/>
    <line x1="508" y1="200" x2="508" y2="208"/><line x1="508" y1="230" x2="508" y2="238"/>
    <line x1="508" y1="260" x2="508" y2="268"/><line x1="508" y1="290" x2="508" y2="298"/>
    <line x1="508" y1="320" x2="508" y2="328"/><line x1="508" y1="350" x2="508" y2="358"/>
  </g>
  <text x="508" y="402" font-size="13" fill="#e65100" text-anchor="middle">같은 칸에 9개</text>
  <text x="508" y="420" font-size="13" fill="#e65100" text-anchor="middle">찾기 O(n)</text>

  <g font-size="13" fill="#2e7d32">
    <text x="60" y="230" font-weight="700">정상 상태</text>
    <text x="60" y="250">해시가 고르면 한 칸에 0~2개</text>
    <text x="60" y="275">한 칸에 8개가 몰릴 확률</text>
    <text x="60" y="295">≈ 0.00000006 (1억분의 6)</text>
  </g>
  <g font-size="13" fill="#616161">
    <text x="60" y="345">테이블이 64칸 미만이면</text>
    <text x="60" y="365">트리화 대신 리사이징(2배)부터</text>
  </g>

  <line x1="560" y1="250" x2="650" y2="250" stroke="#e65100" stroke-width="3" marker-end="url(#ao)"/>
  <text x="605" y="238" font-size="14" font-weight="700" fill="#e65100" text-anchor="middle">트리화</text>
  <text x="605" y="272" font-size="12" fill="#e65100" text-anchor="middle">체인 &gt; 8</text>
  <text x="605" y="288" font-size="12" fill="#e65100" text-anchor="middle">테이블 ≥ 64</text>

  <g stroke="#616161" stroke-width="1.5">
    <line x1="820" y1="130" x2="740" y2="200"/><line x1="820" y1="130" x2="900" y2="200"/>
    <line x1="740" y1="200" x2="700" y2="270"/><line x1="740" y1="200" x2="780" y2="270"/>
    <line x1="900" y1="200" x2="860" y2="270"/><line x1="900" y1="200" x2="940" y2="270"/>
    <line x1="700" y1="270" x2="672" y2="340"/><line x1="700" y1="270" x2="728" y2="340"/>
  </g>
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="820" cy="130" r="18" fill="#212121"/>
    <circle cx="740" cy="200" r="18" fill="#c62828"/><circle cx="900" cy="200" r="18" fill="#c62828"/>
    <circle cx="700" cy="270" r="18" fill="#212121"/><circle cx="780" cy="270" r="18" fill="#212121"/>
    <circle cx="860" cy="270" r="18" fill="#212121"/><circle cx="940" cy="270" r="18" fill="#212121"/>
    <circle cx="672" cy="340" r="18" fill="#c62828"/><circle cx="728" cy="340" r="18" fill="#c62828"/>
  </g>
  <text x="810" y="395" font-size="14" font-weight="700" fill="#212121" text-anchor="middle">레드-블랙 트리: 최악이 O(n)에서 O(log n)으로</text>
  <text x="810" y="418" font-size="13" fill="#616161" text-anchor="middle">6개 이하로 줄면 다시 리스트 (경계에서 반복 전환 방지)</text>
</svg>
